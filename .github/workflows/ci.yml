name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # The app embeds dist/ at compile time, so build the frontend first.
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  e2e:
    name: End to end against UNBEATEN
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ofujiiro/UNBEATEN
          path: unbeaten
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r unbeaten/backend/requirements-dev.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ubl
      - name: Chart hash vectors match UNBEATEN's
        run: diff unbeaten/backend/tests/fixtures/chart_hash_vectors.json crates/core/tests/fixtures/chart_hash_vectors.json
      - run: >
          python3 scripts/e2e.py --unbeaten unbeaten
          --charts scripts/e2e-fixtures/charts
          --save scripts/e2e-fixtures/arcade-highscores.json
          --ubl target/debug/ubl
