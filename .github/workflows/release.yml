# Push a tag like v0.1.0 to build installers for Windows (.exe, .msi) and
# Linux (.AppImage, .deb, .rpm) and attach them, with the ubl CLI, to a
# draft GitHub release. Check the draft, then publish it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            cli: target/release/ubl
            cli_name: ubl-linux-x86_64
          - os: windows-latest
            cli: target/release/ubl.exe
            cli_name: ubl-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: UNBEATEN Launcher ${{ github.ref_name }}
          releaseBody: |
            Windows: the `.exe` installer (or the `.msi`).
            Linux: the `.AppImage` (make it executable and run it), or the `.deb` / `.rpm`.
            `ubl-*` is the optional command-line launcher.
          releaseDraft: true
          prerelease: false
      - name: Attach the ubl CLI
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo build --release -p ubl
          cp "${{ matrix.cli }}" "${{ matrix.cli_name }}"
          gh release upload "${{ github.ref_name }}" "${{ matrix.cli_name }}" --clobber
